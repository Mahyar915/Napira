<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Film Reel / Vault Border Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="24" />
  
  <!-- Film Sprocket holes -->
  <circle cx="256" cy="100" r="14" fill="rgba(255,255,255,0.4)" />
  <circle cx="256" cy="412" r="14" fill="rgba(255,255,255,0.4)" />
  <circle cx="100" cy="256" r="14" fill="rgba(255,255,255,0.4)" />
  <circle cx="412" cy="256" r="14" fill="rgba(255,255,255,0.4)" />
  <circle cx="146" cy="146" r="14" fill="rgba(255,255,255,0.4)" />
  <circle cx="366" cy="146" r="14" fill="rgba(255,255,255,0.4)" />
  <circle cx="146" cy="366" r="14" fill="rgba(255,255,255,0.4)" />
  <circle cx="366" cy="366" r="14" fill="rgba(255,255,255,0.4)" />

  <!-- Play Symbol Container -->
  <circle cx="256" cy="256" r="120" fill="rgba(255, 255, 255, 0.2)" filter="url(#shadow)" />
  
  <!-- Play Arrow -->
  <path d="M225 186 L330 256 L225 326 Z" fill="url(#playGrad)" filter="url(#shadow)" />
</svg>
